<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SahaBose-KFAC Optimization Diagnostic</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020408; font-family: 'Inter', sans-serif; }
        #container { width: 100vw; height: 100vh; }
        
        .overlay {
            position: absolute; top: 40px; left: 40px;
            pointer-events: none; z-index: 100;
        }
        .title { 
            font-size: 28px; font-weight: 900; color: #fff; 
            letter-spacing: -1px; margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
        }
        .subtitle { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 4px; font-weight: 800; }

        .legend {
            position: absolute; bottom: 40px; left: 40px;
            background: rgba(15, 23, 42, 0.85); padding: 28px;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6); z-index: 100;
            backdrop-filter: blur(20px);
        }
        .legend-item { display: flex; align-items: center; gap: 20px; font-size: 15px; font-weight: 600; color: #f1f5f9; }
        .dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 15px currentColor; border: 2px solid rgba(255,255,255,0.2); }
        .saha-text { color: #f97316; font-weight: 900; }
        
        .status {
            position: absolute; top: 40px; right: 40px;
            background: rgba(59, 130, 246, 0.1); color: #60a5fa; 
            padding: 12px 24px; border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 40px; font-size: 13px; font-weight: 800;
            display: flex; align-items: center; gap: 12px;
            backdrop-filter: blur(10px);
        }
        .pulse {
            width: 10px; height: 10px; background: #60a5fa; border-radius: 50%;
            box-shadow: 0 0 15px #60a5fa;
            animation: pulse-blue 2s infinite;
        }
        @keyframes pulse-blue {
            0% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(0.9); }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div class="overlay">
        <div class="title">Optimization Diagnostic</div>
        <div class="subtitle">SahaBose-KFAC vs. Baselines</div>
    </div>

    <div class="status">
        <div class="pulse"></div> HOLOGRAPHIC RUN
    </div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #f97316; color: #f97316;"></div> <span class="saha-text">SahaBose-KFAC</span> (Stable/Fast)</div>
        <div class="legend-item"><div class="dot" style="background: #3b82f6; color: #3b82f6;"></div> <strong>Vanilla KFAC</strong> (Erratic)</div>
        <div class="legend-item"><div class="dot" style="background: #10b981; color: #10b981;"></div> <strong>Adam</strong> (Noisy)</div>
        <div class="legend-item"><div class="dot" style="background: #94a3b8; color: #94a3b8;"></div> <strong>SGD</strong> (Vanishing)</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020408);
        
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(24, 20, 24);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('container').appendChild(renderer.domElement);

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const p1 = new THREE.PointLight(0x3b82f6, 3, 100); p1.position.set(20, 20, 20); scene.add(p1);
        const p2 = new THREE.PointLight(0x60a5fa, 2, 100); p2.position.set(-20, 10, -20); scene.add(p2);

        // --- HOLOGRAPHIC GRID LANDSCAPE ---
        function getZ(x, y) {
            return 0.18 * (x*x + y*y) + 
                   0.7 * Math.sin(1.6 * x) * Math.cos(1.6 * y) + 
                   0.4 * Math.sin(4.2 * x) * Math.cos(4.2 * y);
        }

        const size = 22, segments = 100;
        const geo = new THREE.PlaneBufferGeometry(size, size, segments, segments);
        const pos = geo.attributes.position.array;
        const colors_attr = new Float32Array(pos.length);

        for (let i = 0; i < pos.length; i += 3) {
            const x = pos[i], y = pos[i+1];
            const z = getZ(x, y);
            pos[i+2] = z;
            
            // Bright edges based on height
            const h = (z + 2) / 10;
            colors_attr[i] = 0.05 + h * 0.1;     // R
            colors_attr[i+1] = 0.2 + h * 0.4;    // G
            colors_attr[i+2] = 0.4 + h * 0.8;    // B
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors_attr, 3));
        geo.computeVertexNormals();

        // Shaded Surface (Semi-Transparent)
        const planeMat = new THREE.MeshPhongMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 0.55,
            side: THREE.DoubleSide,
            shininess: 100
        });
        const plane = new THREE.Mesh(geo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        // Bright Wireframe Grid (Highly Visible)
        const wireMat = new THREE.MeshBasicMaterial({ 
            color: 0x60a5fa, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.35 
        });
        const wire = new THREE.Mesh(geo, wireMat);
        wire.rotation.x = -Math.PI / 2;
        wire.position.y = 0.02;
        scene.add(wire);

        const floorGrid = new THREE.GridHelper(40, 40, 0x1e293b, 0x0f172a);
        floorGrid.position.y = -3;
        scene.add(floorGrid);

        // --- OPTIMIZERS ---
        const optColors = { sahabose: 0xf97316, kfac: 0x3b82f6, adam: 0x10b981, sgd: 0x94a3b8 };
        const optimizerMeshes = {};
        const pathMeshes = {};
        
        function createOptimizer(color) {
            const sphere = new THREE.Mesh(
                new THREE.SphereBufferGeometry(0.45, 32, 32),
                new THREE.MeshStandardMaterial({ 
                    color: color, 
                    emissive: color, 
                    emissiveIntensity: 1.5,
                    metalness: 1, roughness: 0
                })
            );
            scene.add(sphere);
            return sphere;
        }

        Object.keys(optColors).forEach(key => {
            optimizerMeshes[key] = createOptimizer(optColors[key]);
            pathMeshes[key] = null;
        });

        // --- SYNCHRONIZED PATHS ---
        function generatePaths() {
            const startX = 8.8, startY = 8.8;
            const steps = 300;
            const res = { sahabose: [], kfac: [], adam: [], sgd: [] };
            
            let sX = startX, sY = startY;
            let kX = startX, kY = startY;
            let aX = startX, aY = startY;
            let gX = startX, gY = startY;

            for (let i = 0; i < steps; i++) {
                sX += (0 - sX) * 0.035; sY += (0 - sY) * 0.035;
                res.sahabose.push(new THREE.Vector3(sX, getZ(sX, sY) + 0.35, sY));

                const kfacNoise = i < 160 ? Math.sin(i * 0.4) * 4.5 * (1 - i/220) : 0;
                kX += (0 - kX) * 0.01 + kfacNoise * 0.015;
                kY += (0 - kY) * 0.01 + kfacNoise * 0.015;
                res.kfac.push(new THREE.Vector3(kX, getZ(kX, kY) + 0.35, kY));

                aX += (0 - aX) * 0.02 + (Math.random()-0.5)*1.2;
                aY += (0 - aY) * 0.02 + (Math.random()-0.5)*1.2;
                if (i > 130 && i < 180) { aX -= 0.4; aY += 0.4; }
                res.adam.push(new THREE.Vector3(aX, getZ(aX, aY) + 0.35, aY));

                gX += (0 - gX) * 0.005; gY += (0 - gY) * 0.005;
                res.sgd.push(new THREE.Vector3(gX, getZ(gX, gY) + 0.35, gY));
            }
            return res;
        }

        let pathData = generatePaths();
        let frame = 0;

        function updateTubes() {
            Object.keys(optColors).forEach(key => {
                if (pathMeshes[key]) scene.remove(pathMeshes[key]);
                const points = pathData[key].slice(0, frame + 1);
                if (points.length > 1) {
                    const curve = new THREE.CatmullRomCurve3(points);
                    const geo = new THREE.TubeBufferGeometry(curve, points.length * 2, 0.22, 12, false);
                    pathMeshes[key] = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ 
                        color: optColors[key], 
                        emissive: optColors[key],
                        emissiveIntensity: 1.0,
                        metalness: 0.8, roughness: 0.2
                    }));
                    scene.add(pathMeshes[key]);
                }
                optimizerMeshes[key].position.copy(pathData[key][frame]);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            frame++;
            if (frame >= 300) {
                frame = 0;
                pathData = generatePaths();
            }
            
            updateTubes();

            const time = Date.now() * 0.00018;
            camera.position.x = 28 * Math.cos(time);
            camera.position.z = 28 * Math.sin(time);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
