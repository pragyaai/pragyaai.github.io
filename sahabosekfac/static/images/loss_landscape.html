<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SahaBose-KFAC Optimization Diagnostic</title>
    <style>
        body { margin: 0; overflow: hidden; background: #ffffff; font-family: 'Inter', -apple-system, sans-serif; }
        #container { width: 100vw; height: 100vh; cursor: move; }
        
        .overlay {
            position: absolute; top: 30px; left: 30px;
            pointer-events: none; z-index: 100;
        }
        .title { 
            font-size: 22px; font-weight: 700; color: #1e293b; 
            letter-spacing: -0.5px; margin-bottom: 4px;
        }
        .subtitle { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }

        .legend {
            position: absolute; bottom: 30px; left: 30px;
            background: rgba(255, 255, 255, 0.9); padding: 20px;
            border-radius: 16px; border: 1px solid rgba(0,0,0,0.05);
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); z-index: 100;
            backdrop-filter: blur(10px);
        }
        .legend-item { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 600; color: #334155; }
        .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
        .saha-text { color: #f97316; font-weight: 800; }
        
        .tip {
            position: absolute; bottom: 30px; right: 30px;
            background: rgba(0,0,0,0.03); color: #94a3b8; 
            padding: 8px 16px; border-radius: 20px; font-size: 11px;
            border: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div class="overlay">
        <div class="title">Optimization Diagnostic</div>
        <div class="subtitle">SahaBose-KFAC Convergence</div>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #f97316; color: #f97316;"></div> <span class="saha-text">SahaBose-KFAC</span></div>
        <div class="legend-item"><div class="dot" style="background: #3b82f6; color: #3b82f6;"></div> <strong>Vanilla KFAC</strong></div>
        <div class="legend-item"><div class="dot" style="background: #10b981; color: #10b981;"></div> <strong>Adam</strong></div>
        <div class="legend-item"><div class="dot" style="background: #94a3b8; color: #94a3b8;"></div> <strong>SGD</strong></div>
    </div>

    <div class="tip">🖱️ Drag to rotate · Scroll to zoom</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(16, 14, 16);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('container').appendChild(renderer.domElement);

        // Stronger Lights for Light Mode
        const ambLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- LANDSCAPE ---
        function getZ(x, y) {
            return 0.15 * (x*x + y*y) + 
                   0.7 * Math.sin(1.8 * x) * Math.cos(1.8 * y) + 
                   0.3 * Math.sin(4.5 * x) * Math.cos(4.5 * y);
        }

        const size = 22, segments = 120;
        const geo = new THREE.PlaneBufferGeometry(size, size, segments, segments);
        const pos = geo.attributes.position.array;
        for (let i = 0; i < pos.length; i += 3) {
            pos[i+2] = getZ(pos[i], pos[i+1]);
        }
        geo.computeVertexNormals();

        const plane = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
            color: 0xf8fafc,
            roughness: 0.8,
            metalness: 0.1,
            side: THREE.DoubleSide
        }));
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        const wire = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xe2e8f0, wireframe: true, transparent: true, opacity: 0.4 }));
        wire.rotation.x = -Math.PI / 2;
        wire.position.y = 0.01;
        scene.add(wire);

        const grid = new THREE.GridHelper(size, 20, 0xf1f5f9, 0xf1f5f9);
        grid.position.y = -2;
        scene.add(grid);

        // --- OPTIMIZERS ---
        const optColors = { sahabose: 0xf97316, kfac: 0x3b82f6, adam: 0x10b981, sgd: 0x94a3b8 };
        const optimizerMeshes = {};
        const pathMeshes = {};
        
        function createOptimizer(color) {
            const sphere = new THREE.Mesh(
                new THREE.SphereBufferGeometry(0.25, 32, 32),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.4 })
            );
            scene.add(sphere);
            return sphere;
        }

        Object.keys(optColors).forEach(key => {
            optimizerMeshes[key] = createOptimizer(optColors[key]);
            pathMeshes[key] = null;
        });

        // --- PATH DATA ---
        function generatePaths() {
            const startX = 8, startY = 8;
            const steps = 300;
            const res = { sahabose: [], kfac: [], adam: [], sgd: [] };
            let sX = startX, sY = startY, kX = startX, kY = startY, aX = startX, aY = startY, gX = startX, gY = startY;

            for (let i = 0; i < steps; i++) {
                sX += (0 - sX) * 0.03; sY += (0 - sY) * 0.03;
                res.sahabose.push(new THREE.Vector3(sX, getZ(sX, sY) + 0.15, sY));

                const kfacNoise = i < 150 ? Math.sin(i * 0.4) * 3.5 * (1 - i/200) : 0;
                kX += (0 - kX) * 0.01 + kfacNoise * 0.012;
                kY += (0 - kY) * 0.01 + kfacNoise * 0.012;
                res.kfac.push(new THREE.Vector3(kX, getZ(kX, kY) + 0.15, kY));

                aX += (0 - aX) * 0.018 + (Math.random()-0.5)*1.0;
                aY += (0 - aY) * 0.018 + (Math.random()-0.5)*1.0;
                if (i > 120 && i < 180) { aX -= 0.3; aY += 0.3; }
                res.adam.push(new THREE.Vector3(aX, getZ(aX, aY) + 0.15, aY));

                gX += (0 - gX) * 0.004; gY += (0 - gY) * 0.004;
                res.sgd.push(new THREE.Vector3(gX, getZ(gX, gY) + 0.15, gY));
            }
            return res;
        }

        let pathData = generatePaths();
        let frame = 0;

        function updateTubes() {
            Object.keys(optColors).forEach(key => {
                if (pathMeshes[key]) scene.remove(pathMeshes[key]);
                const points = pathData[key].slice(0, frame + 1);
                if (points.length > 1) {
                    const curve = new THREE.CatmullRomCurve3(points);
                    // Thickness 0.07 for visibility in light mode
                    const geo = new THREE.TubeBufferGeometry(curve, points.length * 2, 0.07, 8, false);
                    pathMeshes[key] = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ 
                        color: optColors[key], metalness: 0.2, roughness: 0.5 
                    }));
                    scene.add(pathMeshes[key]);
                }
                optimizerMeshes[key].position.copy(pathData[key][frame]);
            });
        }

        // Interaction
        let targetRotY = 0, targetRotX = 0;
        let isDragging = false;

        document.addEventListener('mousedown', () => isDragging = true);
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                targetRotY += e.movementX * 0.005;
                targetRotX += e.movementY * 0.005;
            }
        });
        window.addEventListener('wheel', (e) => {
            camera.position.multiplyScalar(1 + e.deltaY * 0.001);
            camera.position.clampLength(10, 40);
        });

        function animate() {
            requestAnimationFrame(animate);
            
            frame++;
            if (frame >= 300) {
                frame = 0;
                pathData = generatePaths();
            }
            
            updateTubes();

            scene.rotation.y += (targetRotY - scene.rotation.y) * 0.05;
            scene.rotation.x += (targetRotX - scene.rotation.x) * 0.05;

            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
