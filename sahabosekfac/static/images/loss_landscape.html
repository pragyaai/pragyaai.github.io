<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SahaBose-KFAC Optimization Diagnostic</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0b0e14; font-family: 'Inter', 'Segoe UI', sans-serif; }
        #container { width: 100vw; height: 100vh; }
        
        .overlay {
            position: absolute; top: 30px; left: 30px;
            pointer-events: none; z-index: 100;
        }
        .title { 
            font-size: 24px; font-weight: 800; color: #fff; 
            letter-spacing: -0.5px; margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .subtitle { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }

        .legend {
            position: absolute; bottom: 40px; left: 40px;
            background: rgba(15, 23, 42, 0.85); padding: 24px;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4); z-index: 100;
            backdrop-filter: blur(10px);
        }
        .legend-item { display: flex; align-items: center; gap: 16px; font-size: 14px; font-weight: 500; color: #e2e8f0; }
        .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 12px currentColor; }
        .saha-text { color: #f97316; font-weight: 800; }
        
        .status {
            position: absolute; top: 30px; right: 30px;
            background: rgba(249, 115, 22, 0.1); color: #f97316; 
            padding: 10px 20px; border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 40px; font-size: 12px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
            backdrop-filter: blur(5px);
        }
        .pulse {
            width: 8px; height: 8px; background: #f97316; border-radius: 50%;
            box-shadow: 0 0 10px #f97316;
            animation: pulse-orange 1.5s infinite;
        }
        @keyframes pulse-orange {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div class="overlay">
        <div class="title">Optimization Diagnostic</div>
        <div class="subtitle">SahaBose-KFAC vs. Baselines</div>
    </div>

    <div class="status">
        <div class="pulse"></div> LIVE ANALYTICS RUN
    </div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #f97316; color: #f97316;"></div> <span class="saha-text">SahaBose-KFAC</span> (Stable Descent)</div>
        <div class="legend-item"><div class="dot" style="background: #3b82f6; color: #3b82f6;"></div> <strong>Vanilla KFAC</strong> (Unstable)</div>
        <div class="legend-item"><div class="dot" style="background: #10b981; color: #10b981;"></div> <strong>Adam</strong> (Overshoot)</div>
        <div class="legend-item"><div class="dot" style="background: #94a3b8; color: #94a3b8;"></div> <strong>SGD</strong> (Vanishing)</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0e14);
        
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(18, 16, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('container').appendChild(renderer.domElement);

        // Lights
        const ambLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambLight);
        
        const pointLight1 = new THREE.PointLight(0x3b82f6, 2, 50);
        pointLight1.position.set(10, 10, 10);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0xf97316, 1.5, 50);
        pointLight2.position.set(-10, 5, -10);
        scene.add(pointLight2);

        // --- ULTRA COMPLEX LANDSCAPE ---
        function getZ(x, y) {
            const r = Math.sqrt(x*x + y*y);
            return 0.18 * (x*x + y*y) + 
                   0.8 * (1 - Math.cos(2.5 * x)) + 
                   0.8 * (1 - Math.cos(2.5 * y)) + 
                   0.5 * Math.sin(6 * x) * Math.sin(6 * y);
        }

        const size = 20, segments = 160;
        const geo = new THREE.PlaneBufferGeometry(size, size, segments, segments);
        const pos = geo.attributes.position.array;
        const colors_attr = new Float32Array(pos.length);

        for (let i = 0; i < pos.length; i += 3) {
            const x = pos[i], y = pos[i+1];
            const z = getZ(x, y);
            pos[i+2] = z;
            
            // Color mapping based on height
            const h = (z + 2) / 10;
            colors_attr[i] = 0.1 + h * 0.2;     // R
            colors_attr[i+1] = 0.15 + h * 0.3;   // G
            colors_attr[i+2] = 0.3 + h * 0.5;   // B
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors_attr, 3));
        geo.computeVertexNormals();

        const plane = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.3,
            metalness: 0.6,
            side: THREE.DoubleSide
        }));
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        const grid = new THREE.GridHelper(20, 20, 0x1e293b, 0x1e293b);
        grid.position.y = -1;
        scene.add(grid);

        // --- OPTIMIZERS ---
        const optColors = { sahabose: 0xf97316, kfac: 0x3b82f6, adam: 0x10b981, sgd: 0x94a3b8 };
        const optimizerMeshes = {};
        const pathMeshes = {};
        
        function createOptimizer(color) {
            const sphere = new THREE.Mesh(
                new THREE.SphereBufferGeometry(0.35, 32, 32),
                new THREE.MeshStandardMaterial({ 
                    color: color, 
                    emissive: color, 
                    emissiveIntensity: 0.8,
                    metalness: 0.8,
                    roughness: 0.1
                })
            );
            scene.add(sphere);
            return sphere;
        }

        Object.keys(optColors).forEach(key => {
            optimizerMeshes[key] = createOptimizer(optColors[key]);
            pathMeshes[key] = null;
        });

        // --- PATH DATA ---
        function generatePaths() {
            const startX = 8, startY = 8;
            const steps = 300;
            const res = { sahabose: [], kfac: [], adam: [], sgd: [] };
            
            let sX = startX, sY = startY;
            let kX = startX, kY = startY;
            let aX = startX, aY = startY;
            let gX = startX, gY = startY;

            for (let i = 0; i < steps; i++) {
                // SahaBose: Direct and fast
                sX += (0 - sX) * 0.028; sY += (0 - sY) * 0.028;
                res.sahabose.push(new THREE.Vector3(sX, getZ(sX, sY) + 0.25, sY));

                // KFAC: High instability early
                const kfacNoise = i < 150 ? Math.sin(i * 0.35) * 3.5 * (1 - i/200) : 0;
                kX += (0 - kX) * 0.01 + kfacNoise * 0.015;
                kY += (0 - kY) * 0.01 + kfacNoise * 0.015;
                res.kfac.push(new THREE.Vector3(kX, getZ(kX, kY) + 0.25, kY));

                // Adam: Noisy/Overshoot
                aX += (0 - aX) * 0.018 + (Math.random()-0.5)*0.8;
                aY += (0 - aY) * 0.018 + (Math.random()-0.5)*0.8;
                if (i > 120 && i < 180) { aX -= 0.2; aY += 0.2; }
                res.adam.push(new THREE.Vector3(aX, getZ(aX, aY) + 0.25, aY));

                // SGD: Slow
                gX += (0 - gX) * 0.004; gY += (0 - gY) * 0.004;
                res.sgd.push(new THREE.Vector3(gX, getZ(gX, gY) + 0.25, gY));
            }
            return res;
        }

        let pathData = generatePaths();
        let frame = 0;

        function updateTubes() {
            Object.keys(optColors).forEach(key => {
                if (pathMeshes[key]) scene.remove(pathMeshes[key]);
                const points = pathData[key].slice(0, frame + 1);
                if (points.length > 1) {
                    const curve = new THREE.CatmullRomCurve3(points);
                    const geo = new THREE.TubeBufferGeometry(curve, points.length * 2, 0.15, 12, false);
                    pathMeshes[key] = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ 
                        color: optColors[key], 
                        emissive: optColors[key],
                        emissiveIntensity: 0.5,
                        metalness: 0.7,
                        roughness: 0.2
                    }));
                    scene.add(pathMeshes[key]);
                }
                optimizerMeshes[key].position.copy(pathData[key][frame]);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            frame++;
            if (frame >= 300) {
                frame = 0;
                pathData = generatePaths();
            }
            
            updateTubes();

            // Cinematic Camera
            const time = Date.now() * 0.00015;
            camera.position.x = 22 * Math.cos(time);
            camera.position.z = 22 * Math.sin(time);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
