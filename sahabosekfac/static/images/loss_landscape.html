<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SABER-KFAC Loss Landscape</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: sans-serif; }
        #container { width: 100vw; height: 100vh; cursor: move; }
        .label {
            position: absolute; top: 10px; left: 10px;
            background: rgba(255,255,255,0.8); padding: 5px 10px;
            border-radius: 5px; font-size: 12px; border: 1px solid #ccc;
        }
        .legend {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(255,255,255,0.9); padding: 10px;
            border-radius: 8px; border: 1px solid #ddd;
            display: flex; flex-direction: column; gap: 5px;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
    </style>
</head>
<body>
    <div id="container"></div>
    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #e67e22;"></div> <strong>SABER-Full</strong> (Stable descent)</div>
        <div class="legend-item"><div class="dot" style="background: #3273dc;"></div> <strong>Vanilla KFAC</strong> (Tail excursions)</div>
        <div class="legend-item"><div class="dot" style="background: #9ca3af;"></div> <strong>SGD</strong> (Slow progress)</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Setup scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 20, 20);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // Loss Landscape Function
        // f(x,y) = x^2 + y^2 + 0.5 * sin(3x) * cos(3y)
        function getZ(x, y) {
            return (x*x + y*y) * 0.1 + 0.5 * Math.sin(3*x) * Math.cos(3*y);
        }

        // Create Grid
        const size = 15;
        const segments = 60;
        const geometry = new THREE.PlaneBufferGeometry(size, size, segments, segments);
        const vertices = geometry.attributes.position.array;

        for (let i = 0; i < vertices.length; i += 3) {
            const x = vertices[i];
            const y = vertices[i+1];
            vertices[i+2] = getZ(x, y);
        }
        geometry.computeVertexNormals();

        const material = new THREE.MeshPhongMaterial({
            color: 0xf0f0f0,
            wireframe: false,
            side: THREE.DoubleSide,
            flatShading: false,
            transparent: true,
            opacity: 0.9
        });
        const plane = new THREE.Mesh(geometry, material);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        // Grid lines for better visualization
        const wireMaterial = new THREE.MeshBasicMaterial({ color: 0xcccccc, wireframe: true, transparent: true, opacity: 0.3 });
        const wirePlane = new THREE.Mesh(geometry, wireMaterial);
        wirePlane.rotation.x = -Math.PI / 2;
        wirePlane.position.y = 0.01;
        scene.add(wirePlane);

        // Paths
        function createPath(color, points) {
            const curve = new THREE.CatmullRomCurve3(points);
            const pathGeometry = new THREE.TubeBufferGeometry(curve, points.length * 2, 0.08, 8, false);
            const pathMaterial = new THREE.MeshPhongMaterial({ color: color });
            const mesh = new THREE.Mesh(pathGeometry, pathMaterial);
            scene.add(mesh);
            return mesh;
        }

        // SABER Path (Smooth)
        const saberPoints = [];
        for (let i = 0; i <= 20; i++) {
            const t = i / 20;
            const x = 5 * Math.cos(t * Math.PI/2) * (1-t);
            const y = 5 * Math.sin(t * Math.PI/2) * (1-t);
            saberPoints.push(new THREE.Vector3(x, getZ(x, y) + 0.1, y));
        }
        const saberMesh = createPath(0xe67e22, saberPoints);

        // Vanilla KFAC Path (Erratic)
        const kfacPoints = [];
        for (let i = 0; i <= 30; i++) {
            const t = i / 30;
            const noiseX = Math.sin(t * 20) * 0.5 * (1-t);
            const noiseY = Math.cos(t * 15) * 0.5 * (1-t);
            const x = 5 * (1-t) + noiseX;
            const y = 5 * (1-t) + noiseY;
            kfacPoints.push(new THREE.Vector3(x, getZ(x, y) + 0.1, y));
        }
        const kfacMesh = createPath(0x3273dc, kfacPoints);

        // SGD Path (Slow/Stuck)
        const sgdPoints = [];
        for (let i = 0; i <= 15; i++) {
            const t = i / 15;
            const x = 5 - (t * 2);
            const y = -2 + (t * 0.5);
            sgdPoints.push(new THREE.Vector3(x, getZ(x, y) + 0.1, y));
        }
        const sgdMesh = createPath(0x9ca3af, sgdPoints);

        // Interaction
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        let isDragging = false;

        document.addEventListener('mousedown', () => isDragging = true);
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                targetRotationY += e.movementX * 0.005;
                targetRotationX += e.movementY * 0.005;
            }
        });

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            
            scene.rotation.y += (targetRotationY - scene.rotation.y) * 0.1;
            scene.rotation.x += (targetRotationX - scene.rotation.x) * 0.1;

            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
