<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SahaBose-KFAC Optimization Diagnostic</title>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: 'Segoe UI', sans-serif; }
        #container { width: 100vw; height: 100vh; }
        
        .overlay {
            position: absolute; top: 20px; left: 20px;
            pointer-events: none; z-index: 100;
        }
        .title { 
            font-size: 20px; font-weight: 800; color: #111; 
            letter-spacing: -0.5px; margin-bottom: 5px;
        }
        .subtitle { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

        .legend {
            position: absolute; bottom: 30px; left: 30px;
            background: rgba(255,255,255,0.9); padding: 20px;
            border-radius: 15px; border: 1px solid #eee;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); z-index: 100;
        }
        .legend-item { display: flex; align-items: center; gap: 15px; font-size: 14px; font-weight: 600; color: #333; }
        .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .saha-text { color: #e67e22; font-weight: 800; }
        
        .status {
            position: absolute; top: 20px; right: 20px;
            background: #1f2937; color: #fff; padding: 8px 20px;
            border-radius: 30px; font-size: 12px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }
        .pulse {
            width: 8px; height: 8px; background: #ff4757; border-radius: 50%;
            animation: pulse-red 1.5s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div class="overlay">
        <div class="title">Optimization Diagnostic</div>
        <div class="subtitle">SahaBose-KFAC vs. Baselines</div>
    </div>

    <div class="status">
        <div class="pulse"></div> LIVE OPTIMIZATION RUN
    </div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #e67e22;"></div> <span class="saha-text">SahaBose-KFAC</span> (Stable Descent)</div>
        <div class="legend-item"><div class="dot" style="background: #3273dc;"></div> <strong>Vanilla KFAC</strong> (Unstable Tail)</div>
        <div class="legend-item"><div class="dot" style="background: #27ae60;"></div> <strong>Adam</strong> (Noisy/Overshoot)</div>
        <div class="legend-item"><div class="dot" style="background: #9ca3af;"></div> <strong>SGD</strong> (Stuck/Slow)</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        
        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(16, 14, 16);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(15, 30, 15);
        scene.add(dirLight);

        // --- ULTRA COMPLEX LANDSCAPE ---
        function getZ(x, y) {
            return 0.15 * (x*x + y*y) + 
                   0.8 * (1 - Math.cos(2.2 * x)) + 
                   0.8 * (1 - Math.cos(2.2 * y)) + 
                   0.6 * Math.sin(5 * x) * Math.sin(5 * y) +
                   0.3 * Math.cos(10 * x);
        }

        const size = 20, segments = 150;
        const geo = new THREE.PlaneBufferGeometry(size, size, segments, segments);
        const pos = geo.attributes.position.array;
        for (let i = 0; i < pos.length; i += 3) {
            pos[i+2] = getZ(pos[i], pos[i+1]);
        }
        geo.computeVertexNormals();

        const plane = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
            color: 0xfafafa, side: THREE.DoubleSide, shininess: 50
        }));
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        const wire = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xeeeeee, wireframe: true, transparent: true, opacity: 0.15 }));
        wire.rotation.x = -Math.PI / 2;
        wire.position.y = 0.01;
        scene.add(wire);

        // --- OPTIMIZERS ---
        const colors = { sahabose: 0xe67e22, kfac: 0x3273dc, adam: 0x27ae60, sgd: 0x9ca3af };
        const optimizerMeshes = {};
        const pathMeshes = {};
        
        function createOptimizer(color) {
            const sphere = new THREE.Mesh(
                new THREE.SphereBufferGeometry(0.3, 32, 32),
                new THREE.MeshPhongMaterial({ color: color, emissive: color, emissiveIntensity: 0.4 })
            );
            scene.add(sphere);
            return sphere;
        }

        Object.keys(colors).forEach(key => {
            optimizerMeshes[key] = createOptimizer(colors[key]);
            pathMeshes[key] = null;
        });

        // --- PATH DATA ---
        function generatePaths() {
            const startX = 7.5, startY = 7.5;
            const steps = 250;
            const res = { sahabose: [], kfac: [], adam: [], sgd: [] };
            
            let sX = startX, sY = startY;
            let kX = startX, kY = startY;
            let aX = startX, aY = startY;
            let gX = startX, gY = startY;

            for (let i = 0; i < steps; i++) {
                // SahaBose: Direct and fast
                sX += (0 - sX) * 0.032; sY += (0 - sY) * 0.032;
                res.sahabose.push(new THREE.Vector3(sX, getZ(sX, sY) + 0.2, sY));

                // KFAC: High instability early
                const kfacNoise = i < 120 ? Math.sin(i * 0.4) * 3 * (1 - i/150) : 0;
                kX += (0 - kX) * 0.012 + kfacNoise * 0.015;
                kY += (0 - kY) * 0.012 + kfacNoise * 0.015;
                res.kfac.push(new THREE.Vector3(kX, getZ(kX, kY) + 0.2, kY));

                // Adam: Noisy/Overshoot
                aX += (0 - aX) * 0.022 + (Math.random()-0.5)*0.6;
                aY += (0 - aY) * 0.022 + (Math.random()-0.5)*0.6;
                if (i > 100 && i < 160) { aX -= 0.15; aY += 0.15; }
                res.adam.push(new THREE.Vector3(aX, getZ(aX, aY) + 0.2, aY));

                // SGD: Slow
                gX += (0 - gX) * 0.005; gY += (0 - gY) * 0.005;
                res.sgd.push(new THREE.Vector3(gX, getZ(gX, gY) + 0.2, gY));
            }
            return res;
        }

        let pathData = generatePaths();
        let frame = 0;

        function updateTubes() {
            Object.keys(colors).forEach(key => {
                if (pathMeshes[key]) scene.remove(pathMeshes[key]);
                const points = pathData[key].slice(0, frame + 1);
                if (points.length > 1) {
                    const curve = new THREE.CatmullRomCurve3(points);
                    // Tube radius = 0.15 (very thick)
                    const geo = new THREE.TubeBufferGeometry(curve, points.length * 2, 0.12, 10, false);
                    pathMeshes[key] = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color: colors[key], shininess: 80 }));
                    scene.add(pathMeshes[key]);
                }
                optimizerMeshes[key].position.copy(pathData[key][frame]);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            frame++;
            if (frame >= 250) {
                frame = 0;
                pathData = generatePaths(); // New random noise for Adam
            }
            
            updateTubes();

            // Auto-camera rotation
            const time = Date.now() * 0.0002;
            camera.position.x = 16 * Math.cos(time);
            camera.position.z = 16 * Math.sin(time);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
