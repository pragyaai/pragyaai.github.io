<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SahaBose-KFAC Optimization Diagnostic</title>
    <style>
        body { margin: 0; overflow: hidden; background: #010204; font-family: 'Inter', sans-serif; }
        #container { width: 100vw; height: 100vh; }
        
        .overlay {
            position: absolute; top: 40px; left: 40px;
            pointer-events: none; z-index: 100;
        }
        .title { 
            font-size: 28px; font-weight: 900; color: #fff; 
            letter-spacing: -1px; margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .subtitle { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 4px; font-weight: 800; }

        .legend {
            position: absolute; bottom: 40px; left: 40px;
            background: rgba(10, 15, 25, 0.8); padding: 25px;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6); z-index: 100;
            backdrop-filter: blur(20px);
        }
        .legend-item { display: flex; align-items: center; gap: 16px; font-size: 14px; font-weight: 600; color: #f1f5f9; }
        .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 15px currentColor; border: 2px solid rgba(255,255,255,0.2); }
        .saha-text { color: #f97316; font-weight: 900; }
        
        .status {
            position: absolute; top: 40px; right: 40px;
            background: rgba(15, 23, 42, 0.6); color: #fff; 
            padding: 10px 20px; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px; font-size: 12px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }
        .pulse {
            width: 8px; height: 8px; background: #22c55e; border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div class="overlay">
        <div class="title">Optimization Diagnostic</div>
        <div class="subtitle">SahaBose-KFAC vs. Baselines</div>
    </div>

    <div class="status">
        <div class="pulse"></div> OPTIMIZATION DYNAMICS
    </div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #f97316; color: #f97316;"></div> <span class="saha-text">SahaBose-KFAC</span> (Stable/Fast)</div>
        <div class="legend-item"><div class="dot" style="background: #3b82f6; color: #3b82f6;"></div> <strong>Vanilla KFAC</strong> (Erratic)</div>
        <div class="legend-item"><div class="dot" style="background: #10b981; color: #10b981;"></div> <strong>Adam</strong> (Noisy)</div>
        <div class="legend-item"><div class="dot" style="background: #94a3b8; color: #94a3b8;"></div> <strong>SGD</strong> (Stuck)</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010204);
        
        // --- FIXED CAMERA POSITION ---
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(18, 18, 18);
        camera.lookAt(0, -1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const p1 = new THREE.PointLight(0x3b82f6, 3, 100); p1.position.set(15, 25, 15); scene.add(p1);
        const p2 = new THREE.PointLight(0xf97316, 2, 100); p2.position.set(-15, 10, -15); scene.add(p2);

        // --- CUSTOM LANDSCAPE ---
        function getZ(x, y) {
            // Base Basin
            let z = 0.12 * (x*x + y*y);
            // Mountains and Valleys
            z += 1.0 * Math.cos(x) * Math.cos(y);
            // Local Minima / Noise
            z += 0.5 * Math.sin(2.5 * x) * Math.sin(2.5 * y);
            // Specific Mountain near start
            z += 2.5 * Math.exp(-(Math.pow(x-5, 2) + Math.pow(y-5, 2)) / 3.0);
            // Specific Trap/Local Minima
            z -= 1.5 * Math.exp(-(Math.pow(x+5, 2) + Math.pow(y+2, 2)) / 2.0);
            return z;
        }

        const size = 24, segments = 120;
        const geo = new THREE.PlaneBufferGeometry(size, size, segments, segments);
        const pos = geo.attributes.position.array;
        const colors_attr = new Float32Array(pos.length);

        for (let i = 0; i < pos.length; i += 3) {
            const x = pos[i], y = pos[i+1];
            const z = getZ(x, y);
            pos[i+2] = z;
            const h = (z + 2) / 10;
            colors_attr[i] = 0.05 + h * 0.1;
            colors_attr[i+1] = 0.15 + h * 0.4;
            colors_attr[i+2] = 0.4 + h * 0.7;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors_attr, 3));
        geo.computeVertexNormals();

        const plane = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({
            vertexColors: true, side: THREE.DoubleSide, transparent: true, opacity: 0.75, shininess: 80
        }));
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        const wire = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x60a5fa, wireframe: true, transparent: true, opacity: 0.25 }));
        wire.rotation.x = -Math.PI / 2;
        wire.position.y = 0.02;
        scene.add(wire);

        const grid = new THREE.GridHelper(40, 40, 0x1e293b, 0x0f172a);
        grid.position.y = -3;
        scene.add(grid);

        // --- OPTIMIZERS ---
        const optColors = { sahabose: 0xf97316, kfac: 0x3b82f6, adam: 0x10b981, sgd: 0x94a3b8 };
        const optimizerMeshes = {};
        const pathMeshes = {};
        
        function createOptimizer(color) {
            const sphere = new THREE.Mesh(
                new THREE.SphereBufferGeometry(0.45, 32, 32),
                new THREE.MeshStandardMaterial({ 
                    color: color, emissive: color, emissiveIntensity: 1.5,
                    metalness: 1, roughness: 0
                })
            );
            scene.add(sphere);
            return sphere;
        }

        Object.keys(optColors).forEach(key => {
            optimizerMeshes[key] = createOptimizer(optColors[key]);
            pathMeshes[key] = null;
        });

        // --- PATH DATA ---
        function generatePaths() {
            const startX = 7.5, startY = 7.5; // Shared start at a high ridge
            const steps = 300;
            const res = { sahabose: [], kfac: [], adam: [], sgd: [] };
            
            let sX = startX, sY = startY;
            let kX = startX, kY = startY;
            let aX = startX, aY = startY;
            let gX = startX, gY = startY;

            for (let i = 0; i < steps; i++) {
                // SahaBose: Navigate mountain, hit global basin directly
                sX += (0 - sX) * 0.032; sY += (0 - sY) * 0.032;
                res.sahabose.push(new THREE.Vector3(sX, getZ(sX, sY) + 0.35, sY));

                // KFAC: Oscillation around the mountain early on
                const kfacNoise = i < 140 ? Math.sin(i * 0.4) * 4.0 * (1 - i/200) : 0;
                kX += (0 - kX) * 0.012 + kfacNoise * 0.015;
                kY += (0 - kY) * 0.012 + kfacNoise * 0.015;
                res.kfac.push(new THREE.Vector3(kX, getZ(kX, kY) + 0.35, kY));

                // Adam: Noisy paths, gets caught in local valleys
                aX += (0 - aX) * 0.018 + (Math.random()-0.5)*1.2;
                aY += (0 - aY) * 0.018 + (Math.random()-0.5)*1.2;
                if (i > 150 && i < 200) { aX -= 0.5; aY += 0.5; }
                res.adam.push(new THREE.Vector3(aX, getZ(aX, aY) + 0.35, aY));

                // SGD: Slow progress, gets stuck in the first valley it hits
                const trapX = -5, trapY = -2;
                if (Math.abs(gX - trapX) < 1 && Math.abs(gY - trapY) < 1) {
                   // Stuck in trap
                } else {
                   gX += (0 - gX) * 0.005; gY += (0 - gY) * 0.005;
                }
                res.sgd.push(new THREE.Vector3(gX, getZ(gX, gY) + 0.35, gY));
            }
            return res;
        }

        let pathData = generatePaths();
        let frame = 0;

        function updateTubes() {
            Object.keys(optColors).forEach(key => {
                if (pathMeshes[key]) scene.remove(pathMeshes[key]);
                const points = pathData[key].slice(0, frame + 1);
                if (points.length > 1) {
                    const curve = new THREE.CatmullRomCurve3(points);
                    const geo = new THREE.TubeBufferGeometry(curve, points.length * 2, 0.22, 12, false);
                    pathMeshes[key] = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ 
                        color: optColors[key], emissive: optColors[key],
                        emissiveIntensity: 0.8, metalness: 0.8, roughness: 0.2
                    }));
                    scene.add(pathMeshes[key]);
                }
                optimizerMeshes[key].position.copy(pathData[key][frame]);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            frame++;
            if (frame >= 300) {
                frame = 0;
                pathData = generatePaths();
            }
            
            updateTubes();

            // FIXED CAMERA (Manual drag still enabled if needed, but no auto-rotate)
            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
