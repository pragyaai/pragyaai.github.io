<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SahaBose-KFAC Optimization Diagnostic</title>
    <style>
        body { margin: 0; overflow: hidden; background: #05070a; font-family: 'Inter', sans-serif; }
        #container { width: 100vw; height: 100vh; }
        
        .overlay {
            position: absolute; top: 40px; left: 40px;
            pointer-events: none; z-index: 100;
        }
        .title { 
            font-size: 28px; font-weight: 900; color: #fff; 
            letter-spacing: -1px; margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }
        .subtitle { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }

        .legend {
            position: absolute; bottom: 40px; left: 40px;
            background: rgba(10, 15, 25, 0.7); padding: 30px;
            border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5); z-index: 100;
            backdrop-filter: blur(15px);
        }
        .legend-item { display: flex; align-items: center; gap: 20px; font-size: 15px; font-weight: 600; color: #f8fafc; }
        .dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 15px currentColor; }
        .saha-text { color: #f97316; font-weight: 900; }
        
        .status {
            position: absolute; top: 40px; right: 40px;
            background: rgba(255,255,255,0.05); color: #fff; 
            padding: 12px 24px; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 40px; font-size: 13px; font-weight: 800;
            display: flex; align-items: center; gap: 12px;
            backdrop-filter: blur(10px);
        }
        .pulse {
            width: 10px; height: 10px; background: #22c55e; border-radius: 50%;
            box-shadow: 0 0 15px #22c55e;
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(0.9); }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div class="overlay">
        <div class="title">Optimization Diagnostic</div>
        <div class="subtitle">SahaBose-KFAC Convergence Benchmark</div>
    </div>

    <div class="status">
        <div class="pulse"></div> REAL-TIME SIMULATION
    </div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #f97316; color: #f97316;"></div> <span class="saha-text">SahaBose-KFAC</span> (Stable/Fast)</div>
        <div class="legend-item"><div class="dot" style="background: #3b82f6; color: #3b82f6;"></div> <strong>Vanilla KFAC</strong> (Erratic)</div>
        <div class="legend-item"><div class="dot" style="background: #10b981; color: #10b981;"></div> <strong>Adam</strong> (Noisy)</div>
        <div class="legend-item"><div class="dot" style="background: #94a3b8; color: #94a3b8;"></div> <strong>SGD</strong> (Stuck)</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05070a);
        
        const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(22, 18, 22);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('container').appendChild(renderer.domElement);

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const p1 = new THREE.PointLight(0x3b82f6, 2, 60); p1.position.set(15, 10, 15); scene.add(p1);
        const p2 = new THREE.PointLight(0xf97316, 2, 60); p2.position.set(-15, 5, -15); scene.add(p2);

        // --- TRANSPARENT GLASS LANDSCAPE ---
        function getZ(x, y) {
            // Simplified but still rugged landscape with clear global basin
            return 0.2 * (x*x + y*y) + 
                   0.6 * Math.sin(1.5 * x) * Math.cos(1.5 * y) + 
                   0.3 * Math.sin(4 * x) * Math.cos(4 * y);
        }

        const size = 22, segments = 120;
        const geo = new THREE.PlaneBufferGeometry(size, size, segments, segments);
        const pos = geo.attributes.position.array;
        for (let i = 0; i < pos.length; i += 3) {
            pos[i+2] = getZ(pos[i], pos[i+1]);
        }
        geo.computeVertexNormals();

        // Glass Material
        const planeMat = new THREE.MeshPhysicalMaterial({
            color: 0x1e293b,
            metalness: 0.9,
            roughness: 0.1,
            transparent: true,
            opacity: 0.45,
            side: THREE.DoubleSide,
            transmission: 0.5,
            thickness: 1
        });
        const plane = new THREE.Mesh(geo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);

        // Glowing Wireframe
        const wireMat = new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.2 });
        const wire = new THREE.Mesh(geo, wireMat);
        wire.rotation.x = -Math.PI / 2;
        wire.position.y = 0.01;
        scene.add(wire);

        // Floor Grid
        const grid = new THREE.GridHelper(30, 30, 0x0f172a, 0x0f172a);
        grid.position.y = -2;
        scene.add(grid);

        // --- OPTIMIZERS ---
        const optColors = { sahabose: 0xf97316, kfac: 0x3b82f6, adam: 0x10b981, sgd: 0x94a3b8 };
        const optimizerMeshes = {};
        const pathMeshes = {};
        
        function createOptimizer(color) {
            const sphere = new THREE.Mesh(
                new THREE.SphereBufferGeometry(0.4, 32, 32),
                new THREE.MeshStandardMaterial({ 
                    color: color, 
                    emissive: color, 
                    emissiveIntensity: 1.2,
                    metalness: 1, roughness: 0
                })
            );
            scene.add(sphere);
            return sphere;
        }

        Object.keys(optColors).forEach(key => {
            optimizerMeshes[key] = createOptimizer(optColors[key]);
            pathMeshes[key] = null;
        });

        // --- SYNCHRONIZED PATHS ---
        function generatePaths() {
            const startX = 8.5, startY = 8.5; // Shared start
            const steps = 300;
            const res = { sahabose: [], kfac: [], adam: [], sgd: [] };
            
            let sX = startX, sY = startY;
            let kX = startX, kY = startY;
            let aX = startX, aY = startY;
            let gX = startX, gY = startY;

            for (let i = 0; i < steps; i++) {
                // SahaBose: Smooth, direct, faster
                sX += (0 - sX) * 0.035; sY += (0 - sY) * 0.035;
                res.sahabose.push(new THREE.Vector3(sX, getZ(sX, sY) + 0.3, sY));

                // KFAC: Instability
                const kfacNoise = i < 160 ? Math.sin(i * 0.4) * 4 * (1 - i/220) : 0;
                kX += (0 - kX) * 0.01 + kfacNoise * 0.015;
                kY += (0 - kY) * 0.01 + kfacNoise * 0.015;
                res.kfac.push(new THREE.Vector3(kX, getZ(kX, kY) + 0.3, kY));

                // Adam: Noisy
                aX += (0 - aX) * 0.02 + (Math.random()-0.5)*1.0;
                aY += (0 - aY) * 0.02 + (Math.random()-0.5)*1.0;
                if (i > 130 && i < 180) { aX -= 0.3; aY += 0.3; }
                res.adam.push(new THREE.Vector3(aX, getZ(aX, aY) + 0.3, aY));

                // SGD: Slow
                gX += (0 - gX) * 0.005; gY += (0 - gY) * 0.005;
                res.sgd.push(new THREE.Vector3(gX, getZ(gX, gY) + 0.3, gY));
            }
            return res;
        }

        let pathData = generatePaths();
        let frame = 0;

        function updateTubes() {
            Object.keys(optColors).forEach(key => {
                if (pathMeshes[key]) scene.remove(pathMeshes[key]);
                const points = pathData[key].slice(0, frame + 1);
                if (points.length > 1) {
                    const curve = new THREE.CatmullRomCurve3(points);
                    const geo = new THREE.TubeBufferGeometry(curve, points.length * 2, 0.18, 12, false);
                    pathMeshes[key] = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ 
                        color: optColors[key], 
                        emissive: optColors[key],
                        emissiveIntensity: 0.8,
                        metalness: 0.8, roughness: 0.2
                    }));
                    scene.add(pathMeshes[key]);
                }
                optimizerMeshes[key].position.copy(pathData[key][frame]);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            frame++;
            if (frame >= 300) {
                frame = 0;
                pathData = generatePaths();
            }
            
            updateTubes();

            // Cinematic Orbital Camera
            const time = Date.now() * 0.0002;
            camera.position.x = 26 * Math.cos(time);
            camera.position.z = 26 * Math.sin(time);
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
